[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[[services]]
name = "app"
source = "."

[services.deploy]
startCommand = "gunicorn rag_platform.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --access-logfile - --error-logfile -"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
