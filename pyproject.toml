[project]
name = "rag-platform"
version = "0.1.0"
description = "Enterprise Multi-Agent RAG Analytics Platform over SEC filings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "You" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "langgraph>=0.2.40",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-ollama>=0.2.0",
    "anthropic>=1.0.0",
    "langchain-community>=0.3.5",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.1",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "streamlit>=1.40.0",
    "pymupdf>=1.24.13",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "duckduckgo-search>=6.3.5",
    "tiktoken>=0.8.0",
    "trulens-eval>=0.33.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "gunicorn>=23.0.0",
    "sentence-transformers>=3.3.0,<4.0.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.5"]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
# 3.12 tolerates PEP 695 syntax in numpy 2.x stubs; runtime still ">=3.11" per [project]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag_platform"]
ignore_missing_imports = true

# numpy 2.x ships stubs that use PEP 695 `type` statements (Python 3.12+ only)
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: slower tests that download real ML models (excluded by default)",
]
addopts = "-ra --strict-markers -m \"not integration\" --cov=rag_platform --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["src/rag_platform"]
omit = [
    "src/rag_platform/ui/*",
    "src/rag_platform/evaluation/trulens_setup.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]