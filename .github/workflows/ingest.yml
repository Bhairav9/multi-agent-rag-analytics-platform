name: Ingest SEC Filings into Qdrant Cloud

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (e.g. AAPL,MSFT,GOOGL,TSLA,JPM)"
        required: true
        default: "AAPL,MSFT"
      years:
        description: "Comma-separated fiscal years (e.g. 2022,2023,2024)"
        required: true
        default: "2024"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LLM_PROVIDER: anthropic
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      QDRANT_COLLECTION: sec_filings
      CHUNK_SIZE_TOKENS: "500"
      CHUNK_OVERLAP_TOKENS: "100"
      RETRIEVAL_TOP_K: "3"
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run ingestion pipeline
        run: |
          uv run python -m rag_platform.ingestion.pipeline \
            --tickers "${{ github.event.inputs.tickers }}" \
            --years "${{ github.event.inputs.years }}"
